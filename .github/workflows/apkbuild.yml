name: Build APK

on:
  push:
    branches: [ Android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install buildozer & cython
        run: pip install --upgrade buildozer cython

      - name: Build APK (release-ready debug)
        run: |
          yes | buildozer android debug

      - name: Rename APK
        run: mv bin/*.apk bin/arch_laucher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arch_laucher
          path: bin/arch_laucher.apk
