name: Build Linux

on:
  push:
    branches: [ Linux ]
  workflow_dispatch:

jobs:
  build:
    # Build trên bản Ubuntu CŨ nhất còn được hỗ trợ: glibc build ra chỉ chạy
    # được trên distro có glibc BẰNG hoặc MỚI hơn. Build ở 22.04 -> chạy được
    # trên Ubuntu 22.04+, Debian 12, Arch, Fedora 36+, Mint 21+...
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài gói hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2 desktop-file-utils

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install ttkbootstrap minecraft-launcher-lib requests pillow pypresence tkinterweb pyinstaller

      - name: Build (onedir + tar.gz + AppImage)
        run: python build_linux.py --appimage --skip-deps

      - name: Kiểm tra nhanh file build
        run: |
          ls -lh dist/
          test -f "dist/ArchClient/ArchClient"

      - uses: actions/upload-artifact@v4
        with:
          name: ArchClient-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
